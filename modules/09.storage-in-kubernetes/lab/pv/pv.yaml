apiVersion: v1
kind: PersistentVolume
metadata:
  name: task-pv-volume
  labels:
    type: local
    tier: backend
    environment: lab
  annotations:
    description: "Volume de stockage persistant dédié au lab Kubernetes"
spec:
  storageClassName: manual
  capacity:
    storage: 4Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/mnt/pv"
    type: DirectoryOrCreate
